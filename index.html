    <!-- Forward old hash-style links (/#/admin) to the new clean paths (/admin) -->
    <script type="text/javascript">
      (function (l) {
        if (l.hash.indexOf('#/') === 0) {
          window.history.replaceState(null, null, l.pathname.replace(/\/$/, '') + l.hash.slice(1));
        }
      }(window.location));
    </script>
    <!-- SPA redirect restore (pairs with 404.html) so deep links like /shop work on GitHub Pages -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>

    <!-- First-paint loader. Inline (no stylesheet, no JS) so it shows the
         instant the HTML lands, before React or the fonts arrive. main.jsx
         fades it out once the app has painted. Mirrors StudioLoader.jsx. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #FDFAF6;
        transition: opacity .55s ease, visibility .55s ease;
      }
      #boot.is-done { opacity: 0; visibility: hidden; }
      #boot svg { width: 96px; height: 96px; overflow: visible; }
      #boot .ring {
        fill: none; stroke: #D9C9A8; stroke-width: 1.5; stroke-dasharray: 3 5;
        transform-origin: 50% 50%; animation: boot-turn 14s linear infinite;
      }
      #boot .knot {
        fill: none; stroke: #C4714A; stroke-width: 2.5; stroke-linecap: round;
        stroke-dasharray: 100; animation: boot-tie 3.4s cubic-bezier(.45,0,.25,1) infinite;
      }
      #boot span {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 1.05rem; color: #7A6050;
        animation: boot-breathe 3.4s ease-in-out infinite;
      }
      @keyframes boot-turn { to { transform: rotate(360deg); } }
      @keyframes boot-tie {
        0%   { stroke-dashoffset: 100; opacity: .35; }
        45%  { stroke-dashoffset: 0;   opacity: 1; }
        65%  { stroke-dashoffset: 0;   opacity: 1; }
        100% { stroke-dashoffset: -100; opacity: .35; }
      }
      @keyframes boot-breathe { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot .ring, #boot .knot, #boot span { animation: none; }
        #boot .knot { stroke-dashoffset: 0; }
      }
    </style>
    <div id="boot">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring" cx="60" cy="60" r="50" pathLength="100"></circle>
        <path class="knot" pathLength="100"
